backend:
  name: git-gateway
  branch: main
  # Git Gateway logs people in with plain email/password (via Netlify Identity)
  # instead of a GitHub account. Requires this admin panel to be served from a
  # Netlify site (the public site itself can stay on GitHub Pages) with Identity
  # and Git Gateway turned on in that Netlify site's settings.

media_folder: "assets/img"
public_folder: "/assets/img"

collections:
  - name: "releases"
    label: "Releases"
    files:
      - name: "releases"
        label: "Releases"
        file: "content/releases.json"
        fields:
          - label: "Upcoming Release"
            name: "upcoming"
            widget: "object"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Label", name: "label", widget: "string" }
              - { label: "Release Date Text", name: "date", widget: "string", hint: "e.g. \"Out October 23, 2026\"" }
              - { label: "Cover Image", name: "image", widget: "image" }
              - { label: "Link", name: "link", widget: "string" }
          - label: "Previous Releases"
            name: "releases"
            widget: "list"
            summary: "{{title}}"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Cover Image", name: "image", widget: "image" }
              - { label: "Award (optional)", name: "award", widget: "string", required: false, default: "" }
              - { label: "Listen Link", name: "link", widget: "string" }

  - name: "gigs"
    label: "Gig Guide"
    files:
      - name: "gigs"
        label: "Gigs List"
        file: "content/gigs.json"
        fields:
          - label: "Gigs"
            name: "gigs"
            widget: "list"
            summary: "{{date}} — {{name}}"
            fields:
              - { label: "Date", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, picker_utc: false, pattern: ["^\\d{4}-\\d{2}-\\d{2}$", "Date must be in YYYY-MM-DD format"] }
              - { label: "End Date (optional, for multi-day gigs)", name: "endDate", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, picker_utc: false, required: false, default: "", pattern: ["^$|^\\d{4}-\\d{2}-\\d{2}$", "Date must be in YYYY-MM-DD format, or left empty"] }
              - { label: "Act / Event Name", name: "name", widget: "string" }
              - { label: "Venue", name: "venue", widget: "string" }
              - { label: "Venue Link (optional)", name: "link", widget: "string", required: false, default: "" }
        # Note: this list isn't sorted by date, and past gigs aren't deleted from
        # here — they're just hidden on the live site once their date passes
        # (see isGigPast() in script.js). Add new gigs anywhere in the list.
